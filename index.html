<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storyboard Document - Material 3</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
  <!-- Export Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      /* Material 3 Color Palette (Light) */
      --md-sys-color-primary: #006874;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #97f0ff;
      --md-sys-color-on-primary-container: #001f24;
      --md-sys-color-surface: #fafdfd;
      --md-sys-color-on-surface: #191c1d;
      --md-sys-color-surface-variant: #dbe4e6;
      --md-sys-color-on-surface-variant: #3f484a;
      --md-sys-color-surface-container-highest: #e4e6e6;
      --md-sys-color-surface-container-high: #e9ecec;
      --md-sys-color-surface-container: #eff1f1;
      --md-sys-color-surface-container-low: #f4f7f7;
      --md-sys-color-surface-container-lowest: #ffffff;
      
      /* Elevations */
      --md-sys-elevation-1: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
      --md-sys-elevation-2: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);
      --md-sys-elevation-3: 0px 1px 3px 0px rgba(0,0,0,0.3), 0px 4px 8px 3px rgba(0,0,0,0.15);

      /* Shape */
      --md-sys-shape-corner-extra-large: 28px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-small: 8px;

      /* Motion */
      --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-duration-medium: 400ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top App Bar */
    .top-app-bar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      box-shadow: var(--md-sys-elevation-2);
      z-index: 20;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--md-sys-color-on-surface-variant);
      background: transparent;
      border: none;
      position: relative;
      overflow: hidden;
    }
    
    .icon-btn:hover::before, .dropdown-item:hover::before { opacity: 0.08; }
    .icon-btn:active::before, .dropdown-item:active::before { opacity: 0.12; }
    .icon-btn::before, .dropdown-item::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: currentColor;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .app-title {
      font-size: 22px;
      font-weight: 400;
      margin-left: 16px;
      flex: 1;
    }

    /* Dropdown Menu */
    .dropdown-container {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-sys-shape-corner-medium);
      box-shadow: var(--md-sys-elevation-3);
      min-width: 240px;
      padding: 8px 0;
      opacity: 0;
      transform: scale(0.9) translateY(-10px);
      transform-origin: top left;
      pointer-events: none;
      transition: opacity var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized),
                  transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
      z-index: 100;
    }

    .dropdown-container.open .dropdown-menu {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .dropdown-item {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      font-size: 16px;
      text-decoration: none;
    }

    /* Scrollable Canvas Area */
    .canvas-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: var(--md-sys-color-surface-container);
    }

    /* The "Document" Page */
    .document-page {
      width: 100%;
      max-width: 800px;
      background-color: white;
      box-shadow: var(--md-sys-elevation-3);
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      overflow: hidden;
    }

    .document-page img {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
      border-bottom: 2px solid #fff; /* Slight separator between scenes if any */
    }
    
    .document-page img:last-child {
      border-bottom: none;
    }

    /* Ripple Effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 600ms linear;
      background-color: currentColor;
      opacity: 0.3;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.8);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      gap: 16px;
    }
    .loading-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid var(--md-sys-color-surface-variant);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-app-bar">
    <div class="dropdown-container" id="menuDropdownContainer">
      <button class="icon-btn ripple-target" onclick="toggleDropdown(event)">
        <span class="material-symbols-outlined">menu</span>
      </button>
      
      <!-- Export Dropdown -->
      <div class="dropdown-menu">
        <div class="dropdown-item ripple-target" onclick="exportDocument('pdf')">
          <span class="material-symbols-outlined" style="color: #db4437;">picture_as_pdf</span>
          Download as PDF
        </div>
        <div class="dropdown-item ripple-target" onclick="exportDocument('word')">
          <span class="material-symbols-outlined" style="color: #4285f4;">description</span>
          Download as Word
        </div>
        <div class="dropdown-item ripple-target" onclick="exportDocument('jpg')">
          <span class="material-symbols-outlined" style="color: #0f9d58;">image</span>
          Download as JPG
        </div>
        <div class="dropdown-item ripple-target" onclick="exportDocument('png')">
          <span class="material-symbols-outlined" style="color: #f4b400;">image</span>
          Download as PNG
        </div>
      </div>
    </div>
    
    <h1 class="app-title">Storyboard Master File</h1>
  </header>

  <!-- Document Canvas -->
  <main class="canvas-area">
    <div class="document-page" id="document-page">
      <img src="1st Scene.jpg" alt="Scene 1">
      <img src="2nd Scene.jpg" alt="Scene 2">
      <img src="3rd Scene.jpg" alt="Scene 3">
      <img src="4th Scene.jpg" alt="Scene 4">
    </div>
  </main>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: var(--md-sys-color-primary);">Generating File...</div>
  </div>

  <script>
    // Ripple Effect Logic
    document.querySelectorAll('.ripple-target').forEach(element => {
      element.addEventListener('mousedown', function(e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size/2}px`;
        ripple.style.top = `${e.clientY - rect.top - size/2}px`;
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });

    // Dropdown Logic
    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('menuDropdownContainer').classList.toggle('open');
    }

    document.addEventListener('click', () => {
      document.getElementById('menuDropdownContainer').classList.remove('open');
    });

    // Export Logic
    async function exportDocument(type) {
      // Close menu
      document.getElementById('menuDropdownContainer').classList.remove('open');
      
      // Show loading
      const loader = document.getElementById('loadingOverlay');
      loader.classList.add('show');
      
      // Give UI a moment to update
      await new Promise(resolve => setTimeout(resolve, 100));
      
      try {
        const element = document.getElementById('document-page');
        // Render canvas (scale for better resolution)
        const canvas = await html2canvas(element, { scale: 2, useCORS: true });
        
        if (type === 'jpg' || type === 'png') {
          const format = type === 'jpg' ? 'jpeg' : 'png';
          const link = document.createElement('a');
          link.download = `Storyboard.${type}`;
          link.href = canvas.toDataURL(`image/${format}`, 1.0);
          link.click();
        } 
        else if (type === 'pdf') {
          const imgData = canvas.toDataURL('image/jpeg', 1.0);
          // Create a PDF with a custom page size that perfectly fits the entire canvas
          const pdf = new window.jspdf.jsPDF({
            orientation: 'p',
            unit: 'px',
            format: [canvas.width, canvas.height]
          });
          
          pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
          pdf.save('Storyboard.pdf');
        } 
        else if (type === 'word') {
          const imgData = canvas.toDataURL('image/jpeg', 1.0);
          const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>";
          const content = `<img src="${imgData}" style="width:100%;" />`;
          const footer = "</" + "body></" + "html>";
          const sourceHTML = header + content + footer;
          
          const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
          const link = document.createElement("a");
          link.href = source;
          link.download = 'Storyboard.doc';
          link.click();
        }
      } catch (error) {
        console.error("Export failed: ", error);
        alert("An error occurred during export.");
      } finally {
        // Hide loading
        loader.classList.remove('show');
      }
    }
  </script>
</body>
</html>
